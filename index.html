
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsUp Messenger</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
}

header {
  background: #087f5b;
  color: white;
  padding: 24px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  font-size: 16px;
}

.container {
  padding: 28px 18px;
  max-width: 480px;
  margin: 24px auto;
}

.card {
  background: white;
  padding: 25px 20px;
  border-radius: 18px;
  box-shadow: 0 4px 16px #00000010;
}

h2 {
  color: #087f5b;
  text-align: center;
  margin: 0 0 12px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 16px 0 8px;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: #087f5b;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.secondary {
  background: white;
  color: #087f5b;
  border: 1px solid #087f5b;
}

.forgot {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  background: transparent;
  color: #087f5b;
  font-size: 15px;
  text-align: right;
}

.note {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 24px;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #777;
  padding: 12px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>WhatsUp</h1>
  <p>Connect with your friends</p>
</header>

<div class="container">
  <div class="card">

    <h2 id="heading">Welcome!</h2>

    <p class="subtitle" id="subtitle">
      Sign in to continue to WhatsUp.
    </p>

    <form id="accountForm">

      <div id="nameGroup" class="hidden">
        <label for="name">Your Name</label>
        <input
          id="name"
          type="text"
          placeholder="Enter your name">
      </div>

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required>

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        minlength="6"
        autocomplete="current-password"
        required>

      <button type="submit" id="mainButton">
        Sign In
      </button>

    </form>

    <button
      type="button"
      class="forgot"
      id="forgotButton">
      Forgot Password?
    </button>

    <button
      type="button"
      class="secondary"
      id="switchButton">
      Create New Account
    </button>

    <p class="note" id="note">
      Sign in with your email and password.
    </p>

  </div>
</div>

<footer>WhatsUp Messenger</footer>

<script>
let signupMode = false;

const heading = document.getElementById("heading");
const subtitle = document.getElementById("subtitle");
const mainButton = document.getElementById("mainButton");
const switchButton = document.getElementById("switchButton");
const forgotButton = document.getElementById("forgotButton");
const nameGroup = document.getElementById("nameGroup");
const nameInput = document.getElementById("name");
const passwordInput = document.getElementById("password");
const note = document.getElementById("note");

switchButton.addEventListener("click", function() {
  signupMode = !signupMode;

  if (signupMode) {
    heading.textContent = "Create Account";
    subtitle.textContent = "Join WhatsUp using your email.";
    mainButton.textContent = "Sign Up";
    switchButton.textContent = "Already have an account? Sign In";
    nameGroup.classList.remove("hidden");
    nameInput.required = true;
    passwordInput.autocomplete = "new-password";
    forgotButton.classList.add("hidden");
    note.textContent = "Account registration will be connected later.";
  } else {
    heading.textContent = "Welcome!";
    subtitle.textContent = "Sign in to continue to WhatsUp.";
    mainButton.textContent = "Sign In";
    switchButton.textContent = "Create New Account";
    nameGroup.classList.add("hidden");
    nameInput.required = false;
    passwordInput.autocomplete = "current-password";
    forgotButton.classList.remove("hidden");
    note.textContent = "Sign in with your email and password.";
  }
});

forgotButton.addEventListener("click", function() {
  alert("Password recovery will be available after Firebase is connected.");
});

document.getElementById("accountForm").addEventListener("submit",
  function(event) {
    event.preventDefault();

    alert("Design is ready! Real sign in and sign up will work after Firebase is connected.");
  }
);
</script>

</body>
</html>
