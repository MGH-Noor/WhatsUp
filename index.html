<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsUp Messenger</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
}

header {
  background: #087f5b;
  color: white;
  padding: 24px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  font-size: 16px;
}

.container {
  padding: 28px 18px;
  max-width: 480px;
  margin: 24px auto;
}

.card {
  background: white;
  padding: 25px 20px;
  border-radius: 18px;
  box-shadow: 0 4px 16px #00000010;
}

h2 {
  color: #087f5b;
  text-align: center;
  margin: 0 0 12px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 16px 0 8px;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: #087f5b;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.secondary {
  background: white;
  color: #087f5b;
  border: 1px solid #087f5b;
}

.forgot {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  background: transparent;
  color: #087f5b;
  font-size: 15px;
  text-align: right;
}

.note {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 24px;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #777;
  padding: 12px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>WhatsUp</h1>
  <p>Connect with your friends</p>
</header>

<div class="container">
  <div class="card">

    <h2 id="heading">Welcome!</h2>

    <p class="subtitle" id="subtitle">
      Sign in to continue to WhatsUp.
    </p>

    <form id="accountForm">

      <div id="nameGroup" class="hidden">
        <label for="name">Your Name</label>
        <input
          id="name"
          type="text"
          placeholder="Enter your name">
      </div>

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required>

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        minlength="6"
        autocomplete="current-password"
        required>

      <button type="submit" id="mainButton">
        Sign In
      </button>

    </form>

    <button
      type="button"
      class="forgot"
      id="forgotButton">
      Forgot Password?
    </button>

    <button
      type="button"
      class="secondary"
      id="switchButton">
      Create New Account
    </button>

    <p class="note" id="note">
      Sign in with your email and password.
    </p>

  </div>
</div>

<footer>WhatsUp Messenger</footer>

<!-- یہاں سے فائر بیس کا کوڈ شروع ہوتا ہے -->
<script type="module">
  // Firebase SDKs درآمد کریں
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  // آپ کا فائر بیس کنفیگریشن
  const firebaseConfig = {
    apiKey: "AIzaSyBkESby5fFZmq6ZxXftqvEP7WNVuFEJstA",
    authDomain: "whatsup-messengers.firebaseapp.com",
    projectId: "whatsup-messengers",
    storageBucket: "whatsup-messengers.firebasestorage.app",
    messagingSenderId: "83533810357",
    appId: "1:83533810357:web:7f35f46ba9a2314800ccfc"
  };

  // فائر بیس کو شروع کریں
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // UI ایلیمنٹس حاصل کریں
  let signupMode = false;
  const heading = document.getElementById("heading");
  const subtitle = document.getElementById("subtitle");
  const mainButton = document.getElementById("mainButton");
  const switchButton = document.getElementById("switchButton");
  const forgotButton = document.getElementById("forgotButton");
  const nameGroup = document.getElementById("nameGroup");
  const nameInput = document.getElementById("name");
  const passwordInput = document.getElementById("password");
  const note = document.getElementById("note");
  const accountForm = document.getElementById("accountForm");

  // سائن ان اور سائن اپ کے درمیان سوئچ کرنے کا فنکشن
  switchButton.addEventListener("click", function() {
    signupMode = !signupMode;

    if (signupMode) {
      heading.textContent = "Create Account";
      subtitle.textContent = "Join WhatsUp using your email.";
      mainButton.textContent = "Sign Up";
      switchButton.textContent = "Already have an account? Sign In";
      nameGroup.classList.remove("hidden");
      nameInput.required = true;
      passwordInput.autocomplete = "new-password";
      forgotButton.classList.add("hidden");
      note.textContent = "Account registration will be connected later.";
    } else {
      heading.textContent = "Welcome!";
      subtitle.textContent = "Sign in to continue to WhatsUp.";
      mainButton.textContent = "Sign In";
      switchButton.textContent = "Create New Account";
      nameGroup.classList.add("hidden");
      nameInput.required = false;
      passwordInput.autocomplete = "current-password";
      forgotButton.classList.remove("hidden");
      note.textContent = "Sign in with your email and password.";
    }
  });

  // پاس ورڈ بھول جانے کا بٹن
  forgotButton.addEventListener("click", function() {
    alert("Password recovery will be available soon.");
  });

  // فارم جمع کرنے کا فنکشن (فائر بیس کے ساتھ)
  accountForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    // بٹن کو غیر فعال کریں تاکہ بار بار کلک نہ ہو
    mainButton.disabled = true;
    mainButton.textContent = "Please wait...";

    try {
      if (signupMode) {
        // نیا اکاؤنٹ بنانا
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        alert("Account created successfully! Welcome " + userCredential.user.email);
        // یہاں آپ چاہیں تو صارف کو اگلے صفحے پر بھیج سکتے ہیں
      } else {
        // موجودہ اکاؤنٹ میں لاگ ان کرنا
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        alert("Logged in successfully! Welcome back " + userCredential.user.email);
        // یہاں آپ چاہیں تو صارف کو اگلے صفحے پر بھیج سکتے ہیں
      }
    } catch (error) {
      // غلطی کی صورت میں پیغام دکھانا
      let errorMessage = error.message;
      
      // فائر بیس کے ایرر کوڈز کو سمجھنے میں آسان بنانا
      if (error.code === 'auth/email-already-in-use') {
        errorMessage = "یہ ای میل پہلے سے رجسٹرڈ ہے۔ براہ کرم لاگ ان کریں۔";
      } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
        errorMessage = "پاس ورڈ غلط ہے۔";
      } else if (error.code === 'auth/user-not-found') {
        errorMessage = "اس ای میل سے کوئی اکاؤنٹ نہیں ملا۔";
      } else if (error.code === 'auth/weak-password') {
        errorMessage = "پاس ورڈ کمزور ہے۔ کم از کم 6 حروف استعمال کریں۔";
      } else if (error.code === 'auth/invalid-email') {
        errorMessage = "ای میل کا فارمیٹ درست نہیں ہے۔";
      }
      
      alert("خرابی: " + errorMessage);
    } finally {
      // بٹن کو دوبارہ فعال کریں
      mainButton.disabled = false;
      mainButton.textContent = signupMode ? "Sign Up" : "Sign In";
    }
  });
</script>

</body>
</html>
