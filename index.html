<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsUp Messenger</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ہیڈر */
  header {
    background: #087f5b;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 24px; }
  #logoutBtn {
    background: transparent;
    color: white;
    border: 1px solid white;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  /* لینڈنگ پیج (لاگ ان/سائن اپ) */
  #authSection {
    padding: 20px;
    flex: 1;
    overflow-y: auto;
  }
  .container {
    max-width: 480px;
    margin: 20px auto;
  }
  .card {
    background: white;
    padding: 25px 20px;
    border-radius: 18px;
    box-shadow: 0 4px 16px #00000010;
  }
  h2 { color: #087f5b; text-align: center; margin: 0 0 12px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
  label { display: block; margin: 16px 0 8px; font-size: 15px; font-weight: bold; }
  input {
    width: 100%; padding: 12px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 16px;
  }
  
  /* پاس ورڈ اور آنکھ کے نشان کے لیے CSS */
  .password-container {
    position: relative;
    display: flex;
    align-items: center;
  }
  .password-container input {
    padding-right: 45px; /* جگہ بنائیں تاکہ آئیکن نہ چھپے */
  }
  .eye-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  /* آئیکن کے رنگ کی سیٹنگز */
  .eye-btn svg {
    width: 22px;
    height: 22px;
    stroke: #999; /* جب پاس ورڈ چھپا ہو (لائٹ بلیک/گرے) */
    transition: 0.2s;
  }
  .eye-btn.active svg {
    stroke: #087f5b; /* جب پاس ورڈ نظر آ رہا ہو (رنگین/سبز) */
  }

  .btn {
    width: 100%; padding: 14px; margin-top: 18px; border: none;
    border-radius: 8px; background: #087f5b; color: white;
    font-size: 16px; cursor: pointer; font-weight: bold;
  }
  .btn:disabled { background: #a0c4b8; cursor: not-allowed; }
  .secondary { background: white; color: #087f5b; border: 1px solid #087f5b; }
  .forgot { display: block; width: 100%; margin-top: 10px; background: transparent; border: none; color: #087f5b; text-align: right; cursor: pointer; }
  .note { text-align: center; color: #777; font-size: 13px; margin-top: 20px; }
  .hidden { display: none !important; }

  /* چیٹ اسکرین */
  #chatSection {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: #efeae2;
    overflow: hidden;
  }
  #messagesArea {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    word-wrap: break-word;
  }
  .msg-my {
    align-self: flex-end;
    background: #d9fdd3;
    border-bottom-right-radius: 2px;
  }
  .msg-other {
    align-self: flex-start;
    background: white;
    border-bottom-left-radius: 2px;
  }
  .msg-info {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
    text-align: right;
  }
  #chatInputArea {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #ddd;
  }
  #messageInput {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
    margin-right: 10px;
  }
  #sendBtn {
    background: #087f5b;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- ہیڈر -->
<header>
  <h1>WhatsUp</h1>
  <button id="logoutBtn" class="hidden">Log Out</button>
</header>

<!-- 1. لاگ ان / سائن اپ سیکشن -->
<div id="authSection">
  <div class="container">
    <div class="card">
      <h2 id="heading">Welcome!</h2>
      <p class="subtitle" id="subtitle">Sign in to continue to WhatsUp.</p>

      <form id="accountForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required>
        
        <label for="password">Password</label>
        <!-- یہاں آنکھ کا بٹن شامل کیا گیا ہے (SVG کے ساتھ) -->
        <div class="password-container">
          <input id="password" type="password" placeholder="Enter your password" minlength="6" required>
          
          <button type="button" id="togglePassword" class="eye-btn">
            <!-- آنکھ بند (کراس والا) آئیکن -->
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            
            <!-- آنکھ کھلی آئیکن (ابھی چھپا ہوا ہے) -->
            <svg id="eyeOpen" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>

        <button type="submit" id="mainButton" class="btn">Sign In</button>
      </form>

      <button type="button" class="forgot" id="forgotButton">Forgot Password?</button>
      <button type="button" class="secondary btn" id="switchButton">Create New Account</button>
      <p class="note" id="note">Sign in with your email and password.</p>
    </div>
  </div>
</div>

<!-- 2. چیٹ سیکشن (لاگ ان کے بعد نظر آئے گا) -->
<div id="chatSection" class="hidden">
  <div id="messagesArea">
    <!-- میسجز یہاں آئیں گے -->
  </div>
  <div id="chatInputArea">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<!-- Firebase اور JavaScript -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBkESby5fFZmq6ZxXftqvEP7WNVuFEJstA",
    authDomain: "whatsup-messengers.firebaseapp.com",
    projectId: "whatsup-messengers",
    storageBucket: "whatsup-messengers.firebasestorage.app",
    messagingSenderId: "83533810357",
    appId: "1:83533810357:web:7f35f46ba9a2314800ccfc"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authSection = document.getElementById("authSection");
  const chatSection = document.getElementById("chatSection");
  const logoutBtn = document.getElementById("logoutBtn");
  const messagesArea = document.getElementById("messagesArea");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  
  let signupMode = false;
  const heading = document.getElementById("heading");
  const subtitle = document.getElementById("subtitle");
  const mainButton = document.getElementById("mainButton");
  const switchButton = document.getElementById("switchButton");
  const forgotButton = document.getElementById("forgotButton");
  const accountForm = document.getElementById("accountForm");

  // --- پاس ورڈ آنکھ کا نیا فنکشن ---
  const togglePassword = document.getElementById("togglePassword");
  const passwordInputField = document.getElementById("password");
  const eyeClosed = document.getElementById("eyeClosed");
  const eyeOpen = document.getElementById("eyeOpen");

  togglePassword.addEventListener("click", function() {
    // ٹائپ چیک کریں اور تبدیل کریں
    const type = passwordInputField.getAttribute("type") === "password" ? "text" : "password";
    passwordInputField.setAttribute("type", type);
    
    // آئیکنز کو تبدیل کریں
    if (type === "text") {
      eyeClosed.classList.add("hidden");
      eyeOpen.classList.remove("hidden");
      togglePassword.classList.add("active"); // رنگ تبدیل کرنے کے لیے
    } else {
      eyeClosed.classList.remove("hidden");
      eyeOpen.classList.add("hidden");
      togglePassword.classList.remove("active"); // رنگ واپس گرے کرنے کے لیے
    }
  });
  // ------------------------------

  switchButton.addEventListener("click", function() {
    signupMode = !signupMode;
    if (signupMode) {
      heading.textContent = "Create Account";
      subtitle.textContent = "Join WhatsUp using your email.";
      mainButton.textContent = "Sign Up";
      switchButton.textContent = "Already have an account? Sign In";
      forgotButton.classList.add("hidden");
    } else {
      heading.textContent = "Welcome!";
      subtitle.textContent = "Sign in to continue to WhatsUp.";
      mainButton.textContent = "Sign In";
      switchButton.textContent = "Create New Account";
      forgotButton.classList.remove("hidden");
    }
  });

  accountForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    mainButton.disabled = true;
    mainButton.textContent = "Please wait...";

    try {
      if (signupMode) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      mainButton.disabled = false;
      mainButton.textContent = signupMode ? "Sign Up" : "Sign In";
    }
  });

  logoutBtn.addEventListener("click", function() {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authSection.classList.add("hidden");
      chatSection.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      loadMessages();
    } else {
      authSection.classList.remove("hidden");
      chatSection.classList.add("hidden");
      logoutBtn.classList.add("hidden");
    }
  });

  function loadMessages() {
    const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
    
    onSnapshot(q, (snapshot) => {
      messagesArea.innerHTML = "";
      
      snapshot.forEach((doc) => {
        const data = doc.data();
        const msgDiv = document.createElement("div");
        
        const isMe = data.uid === auth.currentUser.uid;
        msgDiv.classList.add("message", isMe ? "msg-my" : "msg-other");
        
        const senderName = data.email.split("@")[0]; 
        
        msgDiv.innerHTML = `
          <div style="font-size: 12px; color: #087f5b; font-weight: bold; margin-bottom: 4px;">
            ${isMe ? 'You' : senderName}
          </div>
          <div>${data.text}</div>
          <div class="msg-info">${new Date(data.timestamp?.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        `;
        messagesArea.appendChild(msgDiv);
      });
      
      messagesArea.scrollTop = messagesArea.scrollHeight;
    });
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (text === "") return;

    messageInput.value = "";
    
    try {
      await addDoc(collection(db, "messages"), {
        text: text,
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        timestamp: serverTimestamp()
      });
    } catch (error) {
      alert("Message failed: " + error.message);
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  messageInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

</script>
</body>
</html>
